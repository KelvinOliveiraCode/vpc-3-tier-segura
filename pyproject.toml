[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpcsim"
version = "1.0.0"
description = "Simulador local de VPC com motor de firewall: avalia qual trafego e permitido e mostra em qual regra a decisao foi tomada"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "vpc",
    "firewall",
    "simulador",
    "rede",
    "seguranca",
    "dmz",
    "bastion",
    "stateful",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
# A unica dependencia de execucao e PyYAML, para ler a arquitetura, as regras e
# os cenarios. O resto e biblioteca padrao: ipaddress faz a aritmetica de
# endereco e difflib nao entra porque o tracer e texto montado, nao diff.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
vpcsim = "vpcsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["vpcsim"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]