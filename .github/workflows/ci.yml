name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Conferir encoding dos arquivos de texto
        run: python tools/verificar_encoding.py

      - name: Verificar que o pacote importa
        run: python -c "import vpcsim; print(vpcsim.__version__)"

      - name: Rodar testes com cobertura
        run: python -m pytest --cov=vpcsim --cov-report=term-missing --cov-report=xml

      - name: Conferir cobertura minima
        run: python -m coverage report --fail-under=70

      - name: Prova de aceite
        run: python tools/verificar_aceite.py

      - name: Os 20 cenarios concordam com o motor
        run: |
          python -m vpcsim cenarios
          if ($LASTEXITCODE -ne 0) {
            Write-Error "o motor diverge do esperado em algum cenario"
            exit 1
          }

      - name: O exemplo de tracos esta atualizado
        run: |
          python tools/gerar_exemplo.py
          git diff --exit-code -- exemplos/tracos-de-trafego.txt